# Netlify configuration — static site, no build step.
# Drag the folder that contains this file onto app.netlify.com/drop, or connect the repo.

[build]
  publish = "."
  command = ""

# ── Security headers ─────────────────────────────────────────────────────────
# No Content-Security-Policy here on purpose: the theme snippet is inline in each
# document and the fonts come from fonts.gstatic.com. Add a CSP only after moving
# that snippet to a hashed file.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# ── Caching ──────────────────────────────────────────────────────────────────
# HTML must revalidate; the CSS/JS/SVG bundle can be cached hard because the
# filenames are stable within a deploy.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
